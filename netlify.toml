# Netlify auto-detects Next.js and provisions its OpenNext adapter —
# no publish dir or plugin block needed.
[build]
  command = "pnpm build"

[build.environment]
  NODE_VERSION = "22"
  # Next.js on pnpm requires hoisted node_modules on Netlify
  PNPM_FLAGS = "--shamefully-hoist"

# Production branch (`prod`) serves elluminar.netlify.app until elluminar.com is live
[context.production.environment]
  NEXT_PUBLIC_APP_URL = "https://elluminar.netlify.app"

# Branch deploys (`dev`) serve dev.elluminar.com once the branch subdomain is attached;
# DEPLOY_PRIME_URL resolves to https://dev--<site>.netlify.app until then.
# netlify.toml env values are NOT interpolated, so inject the resolved deploy URL
# through the build command instead (shell-expanded, inlined by Next at build time).
[context.branch-deploy]
  command = "NEXT_PUBLIC_APP_URL=\"$DEPLOY_PRIME_URL\" pnpm build"

# Per-PR preview URLs (deploy-preview-<n>--<site>.netlify.app)
[context.deploy-preview]
  command = "NEXT_PUBLIC_APP_URL=\"$DEPLOY_PRIME_URL\" pnpm build"

[functions."scheduled-maintenance"]
  schedule = "@daily"
